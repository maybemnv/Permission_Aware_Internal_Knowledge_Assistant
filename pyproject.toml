[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permission-aware-internal-knowledge-assistant"
version = "0.1.0"
description = "Permission-safe internal knowledge search and Q&A client-demo prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["apps*", "connectors*", "workers*"]
