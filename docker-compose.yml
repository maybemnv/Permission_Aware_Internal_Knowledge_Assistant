services:
  postgres:
    profiles: ["durable"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: permission_assistant
      POSTGRES_USER: permission_assistant
      POSTGRES_PASSWORD: change-me-in-local-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permission_assistant -d permission_assistant"]
      interval: 5s
      timeout: 5s
      retries: 12

  opensearch:
    profiles: ["durable"]
    image: opensearchproject/opensearch:2.19.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  redis:
    profiles: ["durable"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    profiles: ["fixture"]
    build: .
    environment:
      APP_MODE: fixture
      SEARCH_PROVIDER: fixture
      QUEUE_PROVIDER: inline
      MODEL_PROVIDER: fixture
    ports:
      - "8102:8102"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    profiles: ["fixture"]
    build: ./apps/web
    environment:
      API_ORIGIN: http://api:8102
    ports:
      - "3102:3102"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  opensearch_data:
  redis_data:
